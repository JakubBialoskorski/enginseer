# Documentation sources for the stage 1 dataset.
# Only permissive licenses (CC-BY, Apache, MIT, BSD, MPL); copyleft sources (GPL, CC-BY-SA) are excluded on purpose.
# Every entry records its license; the list is the basis of the model card's data section.
# Each source is a shallow, sparse clone of `paths` (all of the repo when empty).

