# Documentation sources for the stage 1 dataset.
# Only permissive licenses (CC-BY, Apache, MIT, BSD, MPL); copyleft sources (GPL, CC-BY-SA) are excluded on purpose.
# Every entry records its license; the list is the basis of the model card's data section.
# Each source is a shallow, sparse clone of `paths` (all of the repo when empty). Only files under `docs`
# (default: `paths`) become documents; the rest are includes and examples pulled in while cleaning.
# `format` picks the cleaner in scripts/doc_cleaners.py.

# ---------------------------------------------------------------- DevOps

[[source]]
name = "kubernetes"
domain = "devops"
url = "https://github.com/kubernetes/website.git"
paths = ["content/en/docs", "content/en/examples", "content/en/includes"]
docs = ["content/en/docs"]
format = "hugo-k8s"
license = "CC-BY-4.0"

[[source]]
name = "docker"
domain = "devops"
url = "https://github.com/docker/docs.git"
paths = ["content/manuals", "content/includes"]
docs = ["content/manuals"]
format = "hugo-docker"
license = "Apache-2.0"

[[source]]
name = "opentofu"
domain = "devops"
url = "https://github.com/opentofu/opentofu.git"
paths = ["website/docs"]
format = "mdx"
license = "MPL-2.0"

[[source]]
name = "github-actions"
domain = "devops"
url = "https://github.com/github/docs.git"
paths = ["content/actions", "data/variables", "data/reusables"]
docs = ["content/actions"]
format = "liquid-github"
license = "CC-BY-4.0"

[[source]]
name = "prometheus"
domain = "devops"
url = "https://github.com/prometheus/docs.git"
paths = ["docs"]
format = "markdown"
license = "Apache-2.0"

[[source]]
name = "prometheus-server"
domain = "devops"
url = "https://github.com/prometheus/prometheus.git"
paths = ["docs"]
format = "markdown"
license = "Apache-2.0"

[[source]]
name = "nginx"
domain = "devops"
url = "https://github.com/nginx/nginx.org.git"
paths = ["xml/en/docs"]
format = "nginx-xml"
license = "BSD-2-Clause"

[[source]]
name = "openrc"
domain = "linux"
url = "https://github.com/OpenRC/openrc.git"
paths = ["man"]
docs = ["man", "user-guide.md", "service-script-guide.md", "init-guide.md", "supervise-daemon-guide.md", "agetty-guide.md", "runit-guide.md", "s6-guide.md", "BUSYBOX.md", "NEWNET.md"]
format = "markdown"
license = "BSD-2-Clause"

[[source]]
name = "unbound"
domain = "dns"
url = "https://github.com/NLnetLabs/unbound-manual.git"
paths = ["source"]
format = "rst"
license = "BSD-3-Clause"

[[source]]
name = "unbound-man"
domain = "dns"
url = "https://github.com/NLnetLabs/unbound.git"
paths = ["doc"]
format = "rst"
license = "BSD-3-Clause"
note = "man page sources (unbound.conf, unbound-control, ...); the unbound-manual repo only links them through a submodule"

# ---------------------------------------------------------------- Mesh

[[source]]
name = "meshcore"
domain = "mesh"
url = "https://github.com/meshcore-dev/MeshCore.git"
paths = ["docs"]
format = "markdown"
license = "MIT"

[[source]]
name = "meshcore-wiki"
domain = "mesh"
url = "https://github.com/meshcore-dev/MeshCore.wiki.git"
paths = []
format = "markdown"
license = "MIT"
note = "GitHub wiki of the MeshCore repo; no separate license stated, assumed to follow the repo's MIT license"

# ---------------------------------------------------------------- general pretraining corpus (Hugging Face datasets)
# Downloaded with scripts/fetch_corpus.py into data/corpus/<name>/; `files` are glob patterns inside the dataset repo.

[[corpus]]
name = "fineweb-edu"
dataset = "HuggingFaceFW/fineweb-edu"
files = ["sample/10BT/000_00000.parquet", "sample/10BT/001_00000.parquet", "sample/10BT/002_00000.parquet"]
license = "ODC-BY-1.0"
note = "about 0.7B tokens per file"

[[corpus]]
name = "cosmopedia"
dataset = "HuggingFaceTB/cosmopedia"
files = ["data/openstax/*.parquet", "data/khanacademy/*.parquet", "data/wikihow/*.parquet",
         "data/stanford/train-0000[0-2]-*.parquet"]
license = "Apache-2.0"
note = "synthetic textbooks generated with Mixtral-8x7B-Instruct (Apache-2.0)"
