# pipeline check: SFT of the 13M test model (out/runs/test/final.pt)

[train]
base = "test"
epochs = 1
micro_tokens = 8192          # padded tokens per micro-batch: 64 x 128 ... 8 x 1024
grad_accum = 8
lr = 1e-4                    # the learning rate pretraining ended with
min_lr_ratio = 0.1
warmup_steps = 30
weight_decay = 0.1
grad_clip = 1.0
seed = 0
log_every = 10
eval_every = 20

# times every example kind is seen per epoch
[repeat]
qa = 1
trick = 1
translated = 1
oasst = 1
identity = 2
